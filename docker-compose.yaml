version: '3.8'

services:
  jupyter:
    image: jupyter/datascience-notebook
    container_name: jupyter-ai
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    user: root
    command: start-notebook.sh --NotebookApp.token=''
    tty: true